<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avisa+ | Sistema de Alertas</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 400px; width: 100%; }
        h1, h2 { color: #2c3e50; text-align: center; margin-bottom: 5px; }
        h1 { font-size: 24px; }
        h2 { font-size: 20px; color: #2980b9; }
        p.subtitle { text-align: center; color: #7f8c8d; margin-bottom: 25px; font-size: 14px; }
        label { font-weight: bold; color: #34495e; display: block; margin-top: 15px; }
        input, select, textarea { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #bdc3c7; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { background-color: #e74c3c; color: white; border: none; padding: 15px; width: 100%; font-size: 18px; border-radius: 8px; margin-top: 25px; cursor: pointer; font-weight: bold; transition: background 0.3s; }
        button.btn-blue { background-color: #2980b9; }
        button:hover { filter: brightness(90%); }
        .mensagem { margin-top: 20px; padding: 15px; border-radius: 8px; display: none; text-align: center; font-weight: bold; }
        .sucesso { background-color: #d4edda; color: #155724; }
        .risco-Alto { background-color: #ffcccc; color: #cc0000; }
        .risco-Medio { background-color: #fff3cd; color: #856404; }
        .risco-Baixo { background-color: #d4edda; color: #155724; }
    </style>
</head>
<body>

    <!-- BLOCO 1: Reportar Problema -->
    <div class="card">
        <h1>Avisa+</h1>
        <p class="subtitle">Comunique problemas de serviços essenciais</p>
        
        <form id="avisoForm">
            <label for="service_type">Qual é o serviço?</label>
            <select id="service_type" required>
                <option value="agua">Água</option>
                <option value="energia">Energia Elétrica</option>
                <option value="transporte">Transporte Público</option>
            </select>

            <label for="location">Onde está acontecendo?</label>
            <input type="text" id="location" placeholder="Ex: Rua das Flores, Centro" required>

            <label for="description">Descreva o problema:</label>
            <textarea id="description" rows="3" placeholder="Ex: Fio estourado no poste dando choque" required></textarea>

            <button type="submit">Enviar Alerta</button>
        </form>
        <div id="resultadoEvento" class="mensagem"></div>
    </div>

    <!-- BLOCO 2: Radar (Inscrição) -->
    <div class="card">
        <h2>Radar de Prevenção</h2>
        <p class="subtitle">Cadastre-se para ser avisado antes que o problema aconteça na sua região.</p>
        
        <form id="radarForm">
            <label for="telefone">Seu número de Telefone:</label>
            <input type="tel" id="telefone" placeholder="(DD) 99999-9999" required>

            <label for="radar_location">Qual bairro/região quer monitorar?</label>
            <input type="text" id="radar_location" placeholder="Ex: Centro" required>

            <button type="submit" class="btn-blue">Ativar Radar</button>
        </form>
        <div id="resultadoRadar" class="mensagem sucesso"></div>
    </div>

    <!-- BLOCO 3: Painel do Vigia -->
    <div class="card">
        <h2>Painel de Previsão</h2>
        <p class="subtitle">Consulte o satélite para alertas climáticos nas regiões monitoradas.</p>
        <button id="btnVerificar" style="background-color: #f39c12;">Verificar Ameaças Agora</button>
        <div id="resultadoVigia" class="mensagem"></div>
    </div>

    <script>
        // Função para o celular falar (TTS)
        function falarAlerta(risco, descricao) {
            if ('speechSynthesis' in window) {
                const frase = new SpeechSynthesisUtterance(`Atenção. Risco ${risco} registrado. ${descricao}`);
                frase.lang = 'pt-BR';
                window.speechSynthesis.speak(frase);
            }
        }

        // Lógica de envio do Evento
        document.getElementById('avisoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerText = "Enviando...";
            
            const data = {
                service_type: document.getElementById('service_type').value,
                location: document.getElementById('location').value,
                description: document.getElementById('description').value
            };

            try {
                const response = await fetch('/events/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                
                const divResult = document.getElementById('resultadoEvento');
                divResult.style.display = 'block';
                divResult.className = `mensagem risco-${result.risk_level}`;
                divResult.innerText = `✅ Recebido! Risco: ${result.risk_level}`;
                
                if (result.risk_level === 'Alto' || result.risk_level === 'Medio') {
                    falarAlerta(result.risk_level, data.description);
                }
                e.target.reset();
            } catch (error) {
                alert("Erro ao enviar aviso.");
            } finally {
                btn.innerText = "Enviar Alerta";
            }
        });

        // Lógica de Inscrição no Radar
        document.getElementById('radarForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerText = "Cadastrando...";
            
            const data = {
                contact_info: document.getElementById('telefone').value,
                location: document.getElementById('radar_location').value
            };

            try {
                const response = await fetch('/subscribe/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                
                const divResult = document.getElementById('resultadoRadar');
                divResult.style.display = 'block';
                divResult.innerText = `✅ Radar ativado para a região: ${result.location}!`;
                
                e.target.reset();
            } catch (error) {
                alert("Erro ao ativar radar.");
            } finally {
                btn.innerText = "Ativar Radar";
            }
        });

        // Lógica de Consulta do Vigia (Radar Preditivo)
        document.getElementById('btnVerificar').addEventListener('click', async (e) => {
            const btn = e.target;
            btn.innerText = "Consultando Satélite...";
            
            try {
                const response = await fetch('/check-radar/');
                const result = await response.json();
                
                const divResult = document.getElementById('resultadoVigia');
                divResult.style.display = 'block';
                divResult.innerHTML = ""; // Limpa resultados anteriores
                
                if (result.alerts && result.alerts.length > 0) {
                    divResult.className = 'mensagem risco-Alto';
                    divResult.innerHTML = `⚠️ <strong>${result.status}</strong><br>`;
                    
                    result.alerts.forEach(alerta => {
                        // Adiciona o alerta na tela
                        divResult.innerHTML += `<hr>📍 <strong>${alerta.location}</strong>: ${alerta.message}`;
                        
                        // O sistema fala o alerta em voz alta
                        falarAlerta(alerta.risk, `Alerta preventivo para ${alerta.location}. ${alerta.message}`);
                    });
                } else {
                    divResult.className = 'mensagem sucesso';
                    divResult.innerText = `✅ ${result.status}: ${result.message}`;
                }
            } catch (error) {
                alert("Erro ao consultar o satélite.");
            } finally {
                btn.innerText = "Verificar Ameaças Agora";
            }
        });
    </script>
</body>
</html>
